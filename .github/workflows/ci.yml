###############################################################################
# Pull-request checks
#
# Everything here is read-only: it never touches AWS state. Its job is to fail
# a change before it can reach the deploy workflow.
###############################################################################

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # upload-sarif reads run metadata to fingerprint alerts; without this scope
  # it fails with "Resource not accessible by integration".
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.0"
  PYTHON_VERSION: "3.12"
  TF_IN_AUTOMATION: "true"

jobs:
  # --------------------------------------------------------------------------
  # Lambda: lint, unit tests, dependency scanning, Python SAST
  # --------------------------------------------------------------------------
  lambda:
    name: Lambda quality and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      # Dependency scanning for the Lambda.
      - name: Dependency scan (pip-audit)
        run: |
          pip-audit \
            --requirement src/lambda/requirements.txt \
            --strict \
            --desc \
            --format columns

      # Static analysis of the function's own code.
      - name: Python SAST (bandit)
        run: bandit -r src/lambda -ll -f screen

  # --------------------------------------------------------------------------
  # Terraform: formatting, validation, linting
  # --------------------------------------------------------------------------
  terraform:
    name: Terraform validate and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: validation needs no credentials and no remote state.
      - name: Init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Validate shared stack
        run: |
          terraform -chdir=shared init -backend=false
          terraform -chdir=shared validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

  # --------------------------------------------------------------------------
  # Infrastructure-as-Code security scanning
  # --------------------------------------------------------------------------
  iac-security:
    name: IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # Deliberate, documented deviations live in .checkov.yml, not here,
          # so a reviewer sees the justification next to the suppression.
          config_file: .checkov.yml

      # Publishing to the Security tab needs GitHub Code Security, which is free
      # on public repositories but a paid add-on on private ones. This step is
      # therefore best-effort: it starts working on its own if the repository
      # becomes public or gains Code Security, and never fails the gate in the
      # meantime. The gate itself is the Checkov step above, which has already
      # decided pass/fail by this point.

      - name: Upload Checkov SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

      # Always retrievable, with or without Code Security.
      - name: Keep Checkov SARIF as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif-${{ github.job }}
          path: checkov.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-config: trivy.yaml


  # --------------------------------------------------------------------------
  # Speculative plan for BOTH environments, posted back onto the PR
  #
  # There is deliberately no `environment:` key here. A plan is read-only, and
  # attaching the `production` environment would put every pull request behind
  # the production approval gate, which trains reviewers to click approve
  # reflexively, the opposite of what that gate exists for. Credentials come
  # from repository secrets, and each plan assumes a role already fenced to its
  # own environment.
  # --------------------------------------------------------------------------
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [lambda, terraform, iac-security]
    # Fork PRs cannot read secrets; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      # A broken staging plan must not hide the prod plan, or vice versa.
      fail-fast: false
      matrix:
        include:
          - environment: staging
            role_secret: AWS_DEPLOY_ROLE_ARN_STAGING
# commenting out prod stage, as for now prod deployment is out of my budget
#          - environment: prod
#            role_secret: AWS_DEPLOY_ROLE_ARN_PROD
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # AWS authentication via API key. The key belongs to a user whose only
      # permission is sts:AssumeRole into the deployment roles.
      # then immediately trade it for a short-lived session on the deployment role.
      # Assuming the role HERE, not in the Terraform provider:
      # the S3 backend authenticates separately from the provider and would otherwise still be the CI user,
      # whose only permission is sts:AssumeRole. That produced a 403 on the
      # state object. Assuming up front means the backend and the provider both
      # run as the deployment role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          role-external-id: ${{ secrets.AWS_DEPLOY_EXTERNAL_ID }}
          role-session-name: terraform-plan-${{ matrix.environment }}

      # Each matrix leg runs on its own fresh runner, so no -reconfigure is
      # needed even though the two legs use different backend keys.
      - name: Init
        run: >
          terraform -chdir=terraform init
          -backend-config=env/${{ matrix.environment }}.backend.hcl
          -input=false

      - name: Plan
        env:
          TF_VAR_source_version: ${{ github.sha }}
        run: |
          set -o pipefail
          terraform -chdir=terraform plan \
            -var-file=env/${{ matrix.environment }}.tfvars \
            -input=false -no-color -lock-timeout=5m \
            | tee plan.txt

      # One comment per environment, rewritten in place on each push. With two
      # plans per run, appending would bury the PR in stale output.
      - name: Comment plan on the PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const MAX = 60000;
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan:${env} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            let truncated = '';
            if (plan.length > MAX) {
              plan = plan.slice(-MAX);
              truncated = '\n_Output truncated to the last 60 000 characters._\n';
            }
            const body = [
              marker,
              `### Terraform plan \u2014 ${env}`,
              truncated,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

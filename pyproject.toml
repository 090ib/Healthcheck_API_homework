[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/lambda"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101", # assert is the point of a test file
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # placeholder AWS credentials for moto

[tool.bandit]
exclude_dirs = ["tests"]

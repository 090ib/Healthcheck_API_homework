# Checkov configuration.
#
# Suppressions live here, with a reason, rather than as inline
# `checkov:skip` comments scattered through the Terraform, so a reviewer can
# see the complete list of accepted deviations in one place.

framework:
  - terraform

directory:
  - .

skip-path:
  - .terraform
  - .git

# --- Accepted deviations ----------------------------------------------------
skip-check:
  # "Ensure API Gateway caching is enabled". This is a write endpoint; caching
  # responses would be actively wrong, and a cache cluster costs from
  # $0.02/hour.
  - CKV_AWS_120

  # "Ensure API Gateway has a WAF ACL associated". A WAF web ACL costs ~$5 per
  # month per ACL plus $1 per rule and $0.60 per million requests. Stage- and
  # method-level throttling plus a reserved-concurrency cap on the function are
  # the mitigation chosen here; a WAF is the documented next step if the
  # endpoint is ever exposed to untrusted volume.
  - CKV2_AWS_29

  # "Ensure API Gateway method has authorization". The health endpoint is
  # deliberately unauthenticated: it is a liveness probe. Requests are still
  # schema-validated and throttled at the edge. Set `authorization = "AWS_IAM"`
  # in the api_gateway module to close this.
  - CKV_AWS_59
  - CKV2_AWS_53  # request validator -- one IS configured, but Checkov only
  # recognises the pattern where the validator is inline on the method rather
  # than referenced by id.

  # "Ensure S3 bucket has cross-region replication". Deployment artifacts are
  # reproducible from git; replicating them doubles storage cost for no
  # recovery benefit.
  - CKV_AWS_144

  # "Ensure S3 bucket has access logging". Server access logging on the
  # artifact bucket would need a second bucket that also needs logging; the
  # relevant audit trail (who deployed what) is CloudTrail plus the object
  # tags carrying the git SHA.
  - CKV_AWS_18
  - CKV2_AWS_62  # S3 event notifications -- nothing consumes them here

  # "Ensure DynamoDB point-in-time recovery is enabled". Enabled in prod
  # (prod.tfvars) and deliberately off in staging, where the data is
  # disposable and PITR would add ~20% to the table's cost.
  - CKV_AWS_28

  # "Ensure Lambda function is configured for a DLQ". The function is
  # synchronous behind API Gateway; failures surface as a 500 to the caller and
  # a CloudWatch alarm. A DLQ only applies to asynchronous invocations.
  - CKV_AWS_116

  # "Ensure Lambda uses code-signing". Code signing requires an AWS Signer
  # profile, which is out of scope for this exercise. Artifact integrity is
  # covered by the content-addressed S3 key and source_code_hash.
  - CKV_AWS_272
